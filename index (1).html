<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>For My Baby Bunga 🌷</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');
:root{--pink:#d75e8a;--ink:#633d54}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;font-family:'DM Sans',sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 15%,#fff6fa 0,transparent 35%),radial-gradient(circle at 80% 85%,#f8bad1 0,transparent 40%),linear-gradient(145deg,#ffeaf3,#fce1eb);overflow-x:hidden}.card{width:min(92vw,510px);min-height:420px;background:#ffffffc9;backdrop-filter:blur(14px);border:1px solid #fff;border-radius:28px;box-shadow:0 22px 65px #b85a802a;padding:45px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;z-index:2}.flower{font-size:42px;animation:bob 3s ease-in-out infinite}h1{font-family:'Playfair Display',serif;font-size:clamp(28px,6vw,39px);line-height:1.22;margin:20px 0 12px;color:#9c456b}p{font-size:16px;line-height:1.85;margin:8px 0 20px;white-space:pre-line}.small{font-size:13px;color:#a76c88}.actions{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;margin-top:14px;min-height:70px}button{border:0;border-radius:999px;padding:14px 26px;font:700 15px 'DM Sans',sans-serif;cursor:pointer;transition:transform .2s,background .2s;touch-action:manipulation}button:hover{transform:translateY(-2px)}.primary{background:var(--pink);color:white;box-shadow:0 6px 18px #d75e8a50}.secondary{background:#ffe5ef;color:#a4466b;border:1px solid #f5bfd3}.no-zone{position:relative;width:130px;height:65px;display:grid;place-items:center}.no-zone button{position:absolute;white-space:nowrap}.progress{position:absolute;bottom:22px;font-size:12px;letter-spacing:3px;color:#bd8ca3}.heart{position:fixed;bottom:-30px;pointer-events:none;opacity:.5;animation:floatUp linear infinite;z-index:0}.fade{animation:appear .5s ease both}@keyframes floatUp{to{transform:translateY(-115vh) rotate(30deg);opacity:0}}@keyframes bob{50%{transform:translateY(-8px)}}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:420px){.card{padding:36px 21px;min-height:440px}p{font-size:15px}}
</style></head><body><main class="card" id="card" aria-live="polite"></main><script>
const card=document.getElementById('card');let stage=0;const reason=`because i want you to know that i'm serious about getting to know you, baby. 🥹\n\neven though kita baru kenal sekejap, i really appreciate having you in my life. i don't expect you to trust me just because i ask you to. i know trust takes time, honesty, and effort.\n\ni want to show you through my actions that you can feel safe being yourself with me. i'll listen to you, respect your feelings, and keep trying to be someone you can count on.\n\nso please don't feel pressured, okay? i want your trust to come naturally. 💗`;
function show(title,body,buttons,progress,flower='🌷'){card.innerHTML=`<div class="fade"><div class="flower">${flower}</div><h1>${title}</h1><p>${body}</p><div class="actions" id="actions"></div></div><div class="progress">${progress}</div>`;const actions=document.getElementById('actions');buttons(actions)}
function btn(label,fn,cls='primary'){const b=document.createElement('button');b.textContent=label;b.className=cls;b.addEventListener('click',fn);return b}
function shareAnswer(answer){const subject=encodeURIComponent('Baby Bunga’s answer 💗');const body=encodeURIComponent('Hi icad!\n\nMy answer to “Do you approve of my reason?” is: '+answer+'\n\n— Bunga 🌷');window.location.href='mailto:aqielirsyad46@gmail.com?subject='+subject+'&body='+body;}
function endingButtons(a,answer){a.append(btn('send my answer to icad 💌',()=>shareAnswer(answer)));a.append(btn('read again ↻',()=>{stage=0;render()},'secondary'));}
function render(){if(stage===0){show('hey, my baby bunga 💗','i made this little corner of the internet just for you.\n\ni have a few questions for you, baby. are you ready?',a=>a.append(btn('yes, icad! 💌',()=>{stage=1;render()})),'01 / 05');}
else if(stage===1){show('do you trust icad? 🥺','choose your answer, baby hehe',a=>{a.append(btn('yes 💗',()=>{stage=2;render()}));const zone=document.createElement('div');zone.className='no-zone';const no=btn('no 🙈',()=>{},'secondary');zone.append(no);a.append(zone);let moves=0;function dodge(e){if(e)e.preventDefault();moves++;const x=(moves%2?1:-1)*(30+Math.random()*45);const y=(moves%3-1)*28;no.style.transform=`translate(${x}px,${y}px) rotate(${moves%2?9:-9}deg)`;if(moves>=3){const note=document.getElementById('tease');if(note)note.textContent='hehe, the no button is feeling shy 🤭';}}no.addEventListener('pointerenter',dodge);no.addEventListener('pointerdown',dodge);no.addEventListener('focus',dodge);const note=document.createElement('div');note.id='tease';note.className='small';note.style.width='100%';note.textContent='psst... the no button is a little playful 🤭';a.append(note)},'02 / 05','💞');}
else if(stage===2){show('you know why you couldn’t click no? 🤭','because i wanted to make you smile first. but your real answer will always matter to me.\n\ncan i tell you something from my heart?',a=>a.append(btn('tell me, icad 💌',()=>{stage=3;render()})),'03 / 05','💌');}
else if(stage===3){show('a little promise to you 🌷',reason,a=>a.append(btn('one last question 💗',()=>{stage=4;render()})),'04 / 05','🫶');}
else if(stage===4){show('do you approve of my reason?','this time, both answers work. please answer seikhlas hati, baby. i’ll respect your choice. 💗\n\nif you choose to send your answer, it will be shared with icad by email.',a=>{a.append(btn('yes 💗',()=>{stage=5;render()}));a.append(btn('no 🥺',()=>{stage=6;render()},'secondary'))},'05 / 05','💐');}
else if(stage===5){show('thank you, my baby bunga 💗','thank you for giving my words a chance, baby. i promise i won’t take your trust for granted.\n\neven though kita baru kenal sekejap, you’ve already become someone special to me. i’ll keep showing you how much i care, not just saying it.\n\ni love you, baby bunga. 🌷',a=>endingButtons(a,'YES 💗'),'made with love, icad','💖');}
else{show('it’s okay, baby 💌','it’s okay baby, i will try my best to earn your trust. i don’t want to rush you or force you to believe me.\n\ni want you to know that even though kita baru kenal sekejap, i will always have so much love and care for you, babyy.\n\ni’ll let my actions speak, and i’ll respect whatever you feel. take your time, bunga. 🌷',a=>endingButtons(a,'NO 🥺'),'made with love, icad','🌷');}}
render();for(let i=0;i<18;i++){const h=document.createElement('span');h.className='heart';h.textContent=['♡','♥','✿'][i%3];h.style.left=Math.random()*100+'vw';h.style.fontSize=14+Math.random()*22+'px';h.style.color=['#e47fa5','#d9a2b8','#f29bbb'][i%3];h.style.animationDuration=8+Math.random()*11+'s';h.style.animationDelay=-Math.random()*17+'s';document.body.append(h)}
</script></body></html>
